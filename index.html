<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Soulforge Knight</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #2a1c10;
        height: 100%;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none; /* no pull-to-refresh/rubber-band stealing drags */
        -webkit-user-select: none;
        user-select: none;
        position: fixed; /* pin the page so mobile toolbars can't scroll it */
        inset: 0;
        width: 100%;
      }
      #game {
        /* Fill the screen MINUS the iOS safe areas (Dynamic Island / notch /
           status bar at top, home indicator at bottom) so the HUD is never
           hidden under them. On browsers and older phones the insets are 0,
           so this is identical to full-screen there. */
        position: absolute;
        top: env(safe-area-inset-top);
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        left: env(safe-area-inset-left);
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
