<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Soulforge Knight</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #2a1c10;
        height: 100%;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none; /* no pull-to-refresh/rubber-band stealing drags */
        -webkit-user-select: none;
        user-select: none;
        position: fixed; /* pin the page so mobile toolbars can't scroll it */
        inset: 0;
        width: 100%;
      }
      #game {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
